version: 0.1
name: fixes the null-safe workflow from a YAML prompt spec
description: Ensure the fake agent reads the broken file and applies the null-safe replacement when given the bug prompt.

promptSource:
  kind: inline
  text: Fix the TypeError in user-service.ts where name may be undefined

execution:
  timeoutMs: 10000

mocks:
  - tool: grep_search
    when:
      query:
        regex: user-service|TypeError|name
    returns:
      - file: src/user-service.ts
        line: 2
        text: return user.name.trim();

  - tool: read_file
    when:
      filePath: src/user-service.ts
    returns: |
      export function getDisplayName(user) {
        return user.name.trim();
      }

  - tool: replace_string_in_file
    returns:
      success: true

assert:
  tools:
    required:
      - grep_search
      - read_file
      - replace_string_in_file
    sequence:
      - grep_search
      - read_file
      - replace_string_in_file
    only:
      - grep_search
      - read_file
      - replace_string_in_file
    noUnmatchedCalls: true
    calls:
      - tool: replace_string_in_file
        times: 1
        with:
          filePath: src/user-service.ts
          newString:
            regex: user\.name\?\.

  process:
    exitCode: 0
    timeout: false
    durationMsMax: 10000

  output:
    stdoutContains:
      - contains: Applied null-safe fix
    stderrNotContains:
      - regex: .+